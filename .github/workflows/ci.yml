name: Verify infrastructure
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    env:
      CLOUD_DASHBOARD_PORT: 3100
      CLOUD_MC_PORT: 25575
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cloud:init
      - run: docker compose -f deploy/compose.yml up --build --detach --wait --wait-timeout 180
      - run: npm run cloud:verify
      - if: always()
        run: docker compose -f deploy/compose.yml logs --no-color --tail 100
      - if: always()
        run: docker compose -f deploy/compose.yml down
